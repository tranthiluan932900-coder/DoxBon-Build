name: Build DoxBon iOS Library

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build DoxBon dylib
    runs-on: macos-15-intel
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check build environment
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          clang --version

      - name: Build DoxBon
        shell: bash
        run: |
          set -euo pipefail

          test -f DoxBon.dylib.m

          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"

          mkdir -p build

          xcrun --sdk iphoneos clang \
            -fobjc-arc \
            -dynamiclib \
            -arch arm64 \
            -isysroot "$SDK" \
            -miphoneos-version-min=13.0 \
            DoxBon.dylib.m \
            -framework Foundation \
            -framework UIKit \
            -framework CoreGraphics \
            -framework QuartzCore \
            -weak_framework PhotosUI \
            -framework Vision \
            -framework MobileCoreServices \
            -o build/DoxBon.dylib

          test -s build/DoxBon.dylib
          file build/DoxBon.dylib

      - name: Upload DoxBon dylib
        uses: actions/upload-artifact@v4
        with:
          name: DoxBon-iOS
          path: build/DoxBon.dylib
          if-no-files-found: error
          retention-days: 7
