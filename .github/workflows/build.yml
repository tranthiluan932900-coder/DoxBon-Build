name: Build DoxBon iOS Library

'on':
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build iOS dylib
    runs-on: macos-15-intel
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build DoxBon
        shell: bash
        run: |
          set -euo pipefail
          test -f DoxBon.dylib.m || { echo "Missing DoxBon.dylib.m in repository root"; exit 1; }
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          mkdir -p build
          xcrun --sdk iphoneos clang \
            -fobjc-arc \
            -dynamiclib \
            -arch arm64 \
            -isysroot "$SDK" \
            -miphoneos-version-min=13.0 \
            DoxBon.dylib.m \
            -framework Foundation \
            -framework UIKit \
            -o build/DoxBon.dylib

      - name: Upload DoxBon dylib
        uses: actions/upload-artifact@v4
        with:
          name: DoxBon-iOS
          path: build/DoxBon.dylib
          if-no-files-found: error
