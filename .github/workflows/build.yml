
name: Build DoxBon iOS Library

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build DoxBon dylib
    runs-on: macos-15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build DoxBon
        shell: bash
        run: |
          set -euo pipefail

          test -f DoxBon.dylib.m || {
            echo "ERROR: Missing DoxBon.dylib.m"
            exit 1
          }

          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"

          mkdir -p build

          xcrun --sdk iphoneos clang \
            -fobjc-arc \
            -dynamiclib \
            -arch arm64 \
            -isysroot "$SDK" \
            -miphoneos-version-min=13.0 \
            DoxBon.dylib.m \
            -framework Foundation \
            -framework UIKit \
            -weak_framework PhotosUI \
            -framework Vision \
            -framework MobileCoreServices \
            -o build/DoxBon.dylib

          file build/DoxBon.dylib

      - name: Upload DoxBon dylib
        uses: actions/upload-artifact@v4
        with:
          name: DoxBon-iOS
          path: build/DoxBon.dylib
          if-no-files-found: error
